name: Deploy Workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Selecione o ambiente de deploy'
        required: true
        default: staging
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEV_ENV: dev
      STAGING_ENV: staging
      PROD_ENV: prod
      DEPLOY_ENV: ${{ github.event.inputs.environment }}
    steps:
      - name: Checkout do código
        uses: actions/checkout@v3

      - name: Exibir ambiente selecionado
        run: |
          echo "Ambiente de deploy ativo: $DEPLOY_ENV"

      - name: Executar deploy conforme ambiente
        run: |
          if [ "$DEPLOY_ENV" = "$DEV_ENV" ]; then
            echo "Deploy em desenvolvimento concluído"
          elif [ "$DEPLOY_ENV" = "$STAGING_ENV" ]; then
            echo "Deploy em staging concluído"
          elif [ "$DEPLOY_ENV" = "$PROD_ENV" ]; then
            echo "Deploy em produção concluído"
          else
            echo "Ambiente desconhecido"
            exit 1
          fi
