version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: devcalc
    ports:
      - "5432:5432"
    volumes:
      - shared_data:/shared
    networks:
      - dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7
    container_name: redis_cache
    ports:
      - "6379:6379"
    volumes:
      - shared_data:/shared
    networks:
      - dev_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  tester:
    image: busybox
    container_name: dev_box
    networks:
      - dev_network
    command: sh -c "sleep 3600"
    stdin_open: true
    tty: true
    depends_on:
      - postgres
      - redis
    volumes:
      - shared_data:/shared

volumes:
  shared_data:
    driver: local

networks:
  dev_network:
